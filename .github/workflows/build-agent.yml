name: build-cadencesec-agent

on:
  push:
    paths:
      - 'labcontrol/agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

env:
  AGENT_VERSION: 0.1.0

jobs:
  windows-setup-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: labcontrol/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: false

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.10.0

      - name: Build agent.exe (PyInstaller)
        run: python -m PyInstaller agent.spec --noconfirm --clean

      - name: Install NSIS
        shell: pwsh
        run: |
          # Pin NSIS version to avoid pulling an unreviewed newer makensis via Chocolatey.
          choco install nsis --version=3.10 -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "makensis not found after install" }
          & $nsis /VERSION

      - name: Fetch console cert (optional)
        shell: pwsh
        run: |
          if (Test-Path ..\console\state\cert.pem) {
            Copy-Item ..\console\state\cert.pem .\console-cert.pem
          }

      - name: Build CadenceSec-Agent-Setup-${{ env.AGENT_VERSION }}.exe (NSIS)
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" /V2 /DAGENT_EXE="dist\agent.exe" /DINSTALL_PS1="install_service.ps1" /DVERSION=${{ env.AGENT_VERSION }} installer.nsi

      - name: Hash and inspect
        run: |
          Get-Item "CadenceSec-Agent-Setup-${{ env.AGENT_VERSION }}.exe" | Select-Object FullName,Length,LastWriteTime
          Get-FileHash "CadenceSec-Agent-Setup-${{ env.AGENT_VERSION }}.exe" -Algorithm SHA256

      - name: Upload setup.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: CadenceSec-Agent-Setup-${{ env.AGENT_VERSION }}
          path: labcontrol/agent/CadenceSec-Agent-Setup-${{ env.AGENT_VERSION }}.exe

      - name: Upload raw agent.exe (debug)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: CadenceSec-Agent-raw-exe-${{ env.AGENT_VERSION }}
          path: labcontrol/agent/dist/agent.exe
