services:
  console:
    build:
      context: ../console
      dockerfile: ../deploy/Dockerfile
    container_name: cadencesec-console
    restart: unless-stopped
    env_file: .env
    ports:
      - "8443:8443"
    volumes:
      - ../console/state:/app/state
      - ./certs:/app/certs:ro
    command: >
      uvicorn server:app --host 0.0.0.0 --port 8443
      --ssl-keyfile /app/certs/key.pem --ssl-certfile /app/certs/cert.pem
